<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Checklist veicular das rotas de Penedo e Palmeira dos Índios." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Checklist" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Checklist Veicular</title>
    <style>
      /* Pintado antes do JavaScript carregar, para a tela não piscar em branco. */
      html,
      body {
        margin: 0;
        background: #05070b;
        color: #e8eef7;
      }
      .abertura {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 600 15px system-ui, sans-serif;
        letter-spacing: 0.02em;
        color: #8b9ab3;
      }
      .abertura span::after {
        content: '';
        display: inline-block;
        width: 1.2em;
        text-align: left;
        animation: abertura-pontos 1.2s steps(4, end) infinite;
      }
      @keyframes abertura-pontos {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="abertura"><span>Carregando o checklist</span></div>
    </div>
    <noscript>Este aplicativo precisa de JavaScript ativado para funcionar.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
